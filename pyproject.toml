[project]
name = "fortgeist"
version = "0.1.0"
description = "Records Fortnite gameplay: screen video + keyboard/mouse input on one clock"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dxcam==0.3.0",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "opencv-python>=4.10",
    "psutil>=6",
    "pyarrow>=18",
    "pygame-ce>=2.5",
    "rich>=13",
]

[project.scripts]
fortgeist = "fortgeist.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
